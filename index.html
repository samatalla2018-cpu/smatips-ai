<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SmaTrips AI — مساعد المسافر الذكي</title>
  <meta name="description" content="SmaTrips AI هو مساعدك الذكي قبل السفر وأثناء الرحلة: بيانات الرحلة، الجدول اليومي، المهام، الأغراض، الأماكن والخرائط، الطقس، تحويل العملات، والمزيد في مكان واحد." />
  <meta name="theme-color" content="#8B5CF6" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%238B5CF6%22/><path d=%22M12 3l7.5 17-7.5-4-7.5 4z%22 fill=%22white%22/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="app-shell">
    <!-- الشريط الجانبي (سطح المكتب) -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <img src="assets/logo/logo-mark.png" alt="SmaTrips AI" class="brand-logo-img" />
        </div>
        <div class="brand-text">
          <span class="brand-title">SmaTrips AI</span>
          <span class="brand-sub">مساعد المسافر الذكي</span>
        </div>
      </div>

      <button class="search-bar-btn" id="search-open-btn-desktop" type="button">
        <span style="display:flex;align-items:center;gap:8px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>
          بحث سريع…
        </span>
        <span class="hint" style="margin-inline-start:auto;font-size:11px;opacity:.7;">Ctrl K</span>
      </button>

      <button class="btn btn-primary btn-block" id="subscribe-nav-btn" type="button" style="margin-top:2px;display:none;">اشترك الآن</button>

      <div>
        <div class="nav-group-label">الأقسام</div>
        <nav class="nav-list" id="sidebar-nav"></nav>
      </div>
    </aside>

    <!-- العمود الرئيسي -->
    <div class="content-col">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-open-btn" type="button" aria-label="القائمة"></button>
        <div class="topbar-title" id="topbar-title">SmaTrips AI</div>
        <button class="icon-btn" id="search-open-btn" type="button" aria-label="بحث"></button>
      </header>

      <main class="main" id="app-main"></main>

      <footer class="site-footer">
        <div class="footer-inner">
          <div class="footer-title">تواصل معنا</div>
          <p class="footer-desc">يسعدنا تواصلك معنا في أي وقت لأي استفسار أو اقتراح</p>
          <div class="footer-social-row">
            <a class="footer-social-icon whatsapp" href="https://wa.me/966566529226" target="_blank" rel="noopener noreferrer" aria-label="تواصل عبر واتساب"></a>
            <a class="footer-social-icon tiktok" href="https://www.tiktok.com/@smatrips" target="_blank" rel="noopener noreferrer" aria-label="حساب تيك توك"></a>
            <a class="footer-social-icon mail" href="mailto:smatrips52@gmail.com" aria-label="راسلنا عبر البريد الإلكتروني"></a>
            <a class="footer-social-icon phone" href="tel:+966566529226" aria-label="اتصل بنا"></a>
          </div>
          <div class="footer-copy">© 2026 SmaTrips AI — مساعد المسافر الذكي</div>
        </div>
      </footer>

      <nav class="bottom-nav" id="bottom-nav"></nav>
    </div>
  </div>

  <a class="whatsapp-float" href="https://wa.me/966566529226" target="_blank" rel="noopener noreferrer" aria-label="تواصل معنا عبر واتساب" id="whatsapp-float-btn"></a>

  <!-- شيت التنقل للجوال -->
  <div class="nav-sheet-overlay" id="nav-sheet-overlay">
    <div class="nav-sheet">
      <div class="flex items-center justify-between mt-1" style="margin-bottom:16px;">
        <div class="brand" style="padding:0;">
          <div class="brand-mark">
            <img src="assets/logo/logo-mark.png" alt="SmaTrips AI" class="brand-logo-img" style="height:28px;" />
          </div>
          <span class="brand-title">القائمة</span>
        </div>
        <button class="icon-btn" id="nav-sheet-close-btn" type="button" aria-label="إغلاق"></button>
      </div>
      <button class="btn btn-primary btn-block" id="subscribe-nav-btn-mobile" type="button" style="margin-bottom:14px;display:none;">اشترك الآن</button>
      <nav class="nav-list" id="nav-sheet-list"></nav>
    </div>
  </div>

  <!-- نافذة البحث السريع -->
  <div class="overlay" id="search-overlay">
    <div class="search-panel">
      <div class="search-input-row">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="opacity:.6;flex-shrink:0;"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>
        <input id="search-input" type="text" placeholder="ابحث عن مكان، مهمة، يوم، رابط…" autocomplete="off" />
        <button class="icon-btn" id="search-close-btn" type="button" aria-label="إغلاق" style="width:32px;height:32px;"></button>
      </div>
      <div class="search-results" id="search-results"></div>
    </div>
  </div>

  <!-- نافذة الإضافة/التعديل العامة -->
  <div class="overlay" id="modal-overlay">
    <div class="search-panel modal-panel">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="icon-btn" id="modal-close-btn" type="button" aria-label="إغلاق"></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- شاشة نجاح الدفع (تظهر مرة واحدة بعد العودة من بوابة الدفع) -->
  <div class="overlay" id="payment-success-overlay" style="align-items:center;">
    <div class="card" style="max-width:400px; width:100%; text-align:center; padding:32px 26px;">
      <div class="page-header-icon" style="width:56px;height:56px;border-radius:16px;margin:0 auto 14px;background:var(--success-light);color:var(--success);" id="payment-success-icon"></div>
      <h2 style="font-size:20px;margin-bottom:6px;">تم الدفع بنجاح</h2>
      <p class="text-muted" style="margin-bottom:22px;">أهلًا بك في SmaTrips AI</p>
      <div class="flex-col gap-2">
        <button class="btn btn-primary btn-block" id="success-open-assistant-btn">فتح مساعد السفر الذكي</button>
        <button class="btn btn-outline btn-block" id="success-download-trip-btn">تحميل ملف الرحلة</button>
      </div>
    </div>
  </div>

  <div id="toast-host"></div>

  <!-- الأدوات الأساسية -->
  <script src="js/icons.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/router.js"></script>
  <script src="js/modal.js"></script>

  <!-- الصفحات -->
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/trip.js"></script>
  <script src="js/pages/itinerary.js"></script>
  <script src="js/pages/tasks.js"></script>
  <script src="js/pages/packing.js"></script>
  <script src="js/pages/places.js"></script>
  <script src="js/pages/weather.js"></script>
  <script src="js/pages/currency.js"></script>
  <script src="js/pages/plugs.js"></script>
  <script src="js/pages/links.js"></script>
  <script src="js/pages/services.js"></script>
  <script src="js/pages/assistant.js"></script>
  <script src="js/tripfile.js"></script>
  <script src="js/pages/trips.js"></script>
  <script src="js/pages/pay.js"></script>
  <script src="js/pages/notfound.js"></script>

  <!-- الإقلاع -->
  <script src="js/app.js"></script>
</body>
</html>
